workflows:
  ios-capacitor-testflight:
    name: TuttoHQ iOS (Capacitor → TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: TuttoHQ ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tuttohq.app
      vars:
        APP_STORE_APPLE_ID: 6785057230
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build native static export
        script: npm run build:native
      - name: Capacitor sync
        script: npm run cap:sync
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Set up signing (diagnostic)
        script: |
          set -x
          echo "===== LIST BUNDLE IDS VISIBLE TO KEY ====="
          app-store-connect bundle-ids list || true
          echo "===== LIST EXISTING DISTRIBUTION CERTS ====="
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
          echo "===== LIST EXISTING PROFILES ====="
          app-store-connect profiles list || true
          echo "===== ATTEMPT CERT CREATE ====="
          keychain initialize
          app-store-connect certificates create --type IOS_DISTRIBUTION --save || echo "CERT CREATE FAILED ^^^"
          echo "===== ATTEMPT FETCH SIGNING FILES ====="
          app-store-connect fetch-signing-files "com.tuttohq.app" --type IOS_APP_STORE --create || echo "FETCH SIGNING FAILED ^^^"
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          agvtool new-version -all "$NEXT"
      - name: Build & archive .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - THP Internal
