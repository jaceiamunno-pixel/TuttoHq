workflows:
  ios-capacitor-testflight:
    name: TuttoHQ iOS (Capacitor → TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: TuttoHQ ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tuttohq.app
      vars:
        APP_STORE_APPLE_ID: 6785057230
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build native static export
        script: npm run build:native
      - name: Capacitor sync
        script: npm run cap:sync
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Set up signing (diagnostic to failure reason)
        script: |
          OUT=/tmp/signing_diag.txt
          {
            echo "===== BUNDLE IDS VISIBLE TO KEY ====="
            app-store-connect bundle-ids list 2>&1 || echo "(bundle-ids list errored)"
            echo ""
            echo "===== DISTRIBUTION CERTS ====="
            app-store-connect certificates list --type IOS_DISTRIBUTION 2>&1 || echo "(certs list errored)"
            echo ""
            echo "===== PROFILES ====="
            app-store-connect profiles list 2>&1 || echo "(profiles list errored)"
            echo ""
            echo "===== CERT CREATE ATTEMPT ====="
            keychain initialize 2>&1
            app-store-connect certificates create --type IOS_DISTRIBUTION --save 2>&1 || echo "(cert create errored)"
            echo ""
            echo "===== FETCH SIGNING FILES ATTEMPT ====="
            app-store-connect fetch-signing-files "com.tuttohq.app" --type IOS_APP_STORE --create 2>&1 || echo "(fetch signing errored)"
          } > "$OUT" 2>&1
          echo "==================== DIAGNOSTIC OUTPUT ===================="
          cat "$OUT"
          echo "=========================================================="
          # Force the build to fail HERE with the diagnostic as the reason,
          # so the output surfaces in the build's failure panel.
          echo "DIAGNOSTIC COMPLETE - failing intentionally to surface output above"
          exit 1
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          agvtool new-version -all "$NEXT"
      - name: Build & archive .ipa
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - THP Internal
