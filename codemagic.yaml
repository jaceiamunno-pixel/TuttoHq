workflows:
  ios-capacitor-testflight:
    name: TuttoHQ iOS (Capacitor → TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: TuttoHQ ASC Key
    environment:
      groups:
        - tutto_native_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tuttohq.app
      vars:
        APP_STORE_APPLE_ID: 6785057230
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build native static export
        script: npm run build:native
      - name: Capacitor sync
        script: npm run cap:sync
      - name: Increment build number
        script: |
          cd ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          agvtool new-version -all "$NEXT"
      - name: Ensure shared App scheme exists
        script: |
          cd ios/App
          # Generate shared schemes for all targets if none exist
          xcodebuild -list -workspace App.xcworkspace 2>/dev/null || true
          # Use xcode-project to create a shared scheme for the App target
          SCHEME_DIR="App.xcodeproj/xcshareddata/xcschemes"
          mkdir -p "$SCHEME_DIR"
          cat > "$SCHEME_DIR/App.xcscheme" <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1500" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="504EC3031FED79650016851F" BuildableName="App.app" BlueprintName="App" ReferencedContainer="container:App.xcodeproj"></BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"></ArchiveAction>
             <LaunchAction buildConfiguration="Release"></LaunchAction>
          </Scheme>
          SCHEME
          echo "Scheme written. Listing:"
          xcodebuild -list -project App.xcodeproj || true
      - name: Apply profiles to project (writes export_options.plist)
        script: xcode-project use-profiles
      - name: Build & archive .ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" \
            --archive-flags "-destination 'generic/platform=iOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - THP Internal
