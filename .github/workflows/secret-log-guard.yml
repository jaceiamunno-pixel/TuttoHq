name: secret-log-guard

# Fails a PR (and pushes to master) when a console.* statement would log a
# credential — the class of mistake that TEMP-DIAGNOSTIC b074c2a introduced
# (it printed the bearer token) and that only got removed by luck when PR #100
# was squash-merged. Pure Node, zero dependencies — no npm install step.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history so --diff can reach the PR base
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The guard must not be able to disappear quietly. If the detector is
      # missing (deleted, moved, lost on a bad rebase), fail RED here rather than
      # letting a later step no-op to green with no scanning happening.
      - name: Detector must exist
        run: |
          test -f tools/check-secret-logs.mjs \
            || { echo "::error::tools/check-secret-logs.mjs is missing — the secret-log guard would silently not run"; exit 1; }

      - name: Scan for secret-logging console statements
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node tools/check-secret-logs.mjs --diff "${{ github.event.pull_request.base.sha }}"
          else
            node tools/check-secret-logs.mjs --all
          fi

      # Visibility, not a gate: list every allow-secret-log escape hatch so an
      # accumulating pile of suppressions is seen, not buried.
      - name: List allow-secret-log suppressions
        if: ${{ always() }}
        run: node tools/check-secret-logs.mjs --list-suppressions
