<?xml version="1.0" encoding="UTF-8"?>
<!--
  TuttoHQ app-icon source (ADR-009 Phase 1). PLACEHOLDER brand mark — a navy
  field with a white "T" monogram and a slate-blue accent. The mark sits inside
  the maskable safe zone (central ~80% / radius 40%), so the same artwork is
  rasterized for every output: icon-192, icon-512, maskable-512, and
  apple-touch-icon (180). Final production icons are still needed.

  Regenerate the PNGs from this file with sharp:
    node -e "const s=require('sharp'),f=require('fs');for(const[n,p]of[[192,'icon-192.png'],[512,'icon-512.png'],[512,'maskable-512.png'],[180,'apple-touch-icon.png']])s(f.readFileSync('public/icons/icon-source.svg')).resize(n,n).png().toFile('public/icons/'+p)"
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0A1628"/>
  <g fill="#FFFFFF">
    <rect x="120" y="150" width="272" height="52" rx="12"/>
    <rect x="230" y="150" width="52" height="215" rx="12"/>
  </g>
  <rect x="198" y="384" width="116" height="16" rx="8" fill="#7B9BB5"/>
</svg>
